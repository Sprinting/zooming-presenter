[package]
name = "zebra-core"
description = "Document model, command bus, undo, camera and agent-facing queries for Zebra"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
json-patch = "5"
similar = "3"
jsonptr = "0.8.2"
memmap2 = "0.9"
schemars.workspace = true
thiserror.workspace = true
image.workspace = true
base64.workspace = true
dirs.workspace = true
ruzstd.workspace = true
# Grapheme boundaries for split_text and slices; already in the tree via
# egui and parley.
unicode-segmentation = "1.13"

# .zebra files. Not in the web player (wasm32): zip pulls in getrandom's
# wasm-bindgen backend there, and the player reads document.json directly.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip.workspace = true
# Table formulas. Not in the web player: it draws the values files save.
ironcalc_base = "=0.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
