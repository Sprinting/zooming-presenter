[package]
name = "zebra-core"
description = "Document model, command bus, undo, camera and agent-facing queries for Zebra"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
json-patch = "5"
similar = "3"
jsonptr = "0.8.2"
memmap2 = "0.9"
pulldown-cmark = { version = "0.13", default-features = false }
schemars.workspace = true
thiserror.workspace = true
image.workspace = true
base64.workspace = true
dirs.workspace = true
ruzstd.workspace = true

# .zebra files. Not in the web player (wasm32): zip pulls in getrandom's
# wasm-bindgen backend there, and the player reads document.json directly.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip.workspace = true
