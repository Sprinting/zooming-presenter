[package]
name = "zebra-render"
description = "Display list, text layout, and renderers (vello GPU, vello_cpu headless, PDF) for Zebra"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gpu"]
# GPU canvas for the windowed app (vello on eframe's wgpu device = Metal on macOS).
gpu = ["dep:vello", "dep:eframe", "dep:egui-wgpu", "dep:egui", "dep:pollster"]

[dependencies]
zebra-core.workspace = true
serde.workspace = true
serde_json.workspace = true
kurbo.workspace = true
skrifa.workspace = true
parley.workspace = true
unicode-script.workspace = true
vello_cpu.workspace = true
krilla.workspace = true
image.workspace = true
resvg.workspace = true
vello = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

# Worker threads for captures; the web player (wasm32) has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }

[dev-dependencies]
base64.workspace = true
pollster.workspace = true
