[package]
name = "zebra-media"
description = "Video and audio playback for Zebra: a small player trait, AVFoundation on macOS, a poster-only fallback elsewhere"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zebra-core.workspace = true
serde_json.workspace = true
image.workspace = true
# Checking and downloading web video links (link.rs): the platform's TLS
# (Security.framework on the Mac, so nothing compiles C for it), its
# certificates, no cookie store.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(unix)'.dependencies]
# Free space on the disk a download goes to (statvfs).
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSValue", "NSDictionary", "NSArray", "NSError", "NSObject", "NSDate", "NSData", "NSOperation", "NSURLSession", "NSURLRequest", "NSURLResponse", "NSHTTPCookieStorage", "NSURLCache", "NSURLCredentialStorage", "block2"] }
block2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVAssetTrack", "AVAssetImageGenerator", "AVTime", "AVAudioPlayer", "AVMediaFormat", "objc2-core-media", "objc2-core-video", "objc2-core-graphics", "block2"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVAudioPlayer"] }
objc2-core-media = { version = "0.3", features = ["CMTime", "CMTimeRange", "CMBase", "CMSync"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase", "CVPixelBufferPool"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGContext", "CGBitmapContext", "CGColorSpace", "CGDataProvider"] }

[dev-dependencies]
image.workspace = true
