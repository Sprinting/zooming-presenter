[package]
name = "zebra-import"
description = "File > Import: PDF pages and PowerPoint slides as Zebra frames"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zebra-core.workspace = true
image.workspace = true
thiserror.workspace = true

# PDF pages through PDFium, which only ever runs in the separate helper
# process zebra-pdf starts (zebra-pdf-helper), never in Zebra's own.
zebra-pdf.workspace = true

# PowerPoint slides through BetterOffice (Apache-2.0): its parser and the
# DrawingML colour and theme helpers, without the editing and drawing
# engine the `betteroffice-pptx` facade bundles (about 3 MB less).
betteroffice-pptx-parse = "=0.5.1"
betteroffice-drawingml = "=0.5.1"
# What BetterOffice's model leaves out (strike-through, media timing, the
# stand-ins mc:AlternateContent holds), read from the part XML with the XML
# reader the parser already brings in.
quick-xml = { version = "0.41", features = ["encoding"] }
# EMF and WMF pictures as SVG (as Keynote converts them); flate2 (which
# its `svg` feature brings in anyway) for the compressed .emz and .wmz.
betteroffice-metafile = { version = "=0.5.1", features = ["svg"] }
flate2 = "1"
# Reading the .pptx container ourselves: the parser gets the file without
# its media, which is streamed out of the mapped file (see pptx_media).
zip.workspace = true

[dev-dependencies]
libc.workspace = true
memmap2 = "0.9"
zebra-render = { path = "../zebra-render", default-features = false }
serde_json.workspace = true
zip.workspace = true
