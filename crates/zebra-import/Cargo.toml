[package]
name = "zebra-import"
description = "File > Import: PDF (and later PowerPoint) pages as Zebra frames"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zebra-core.workspace = true
image.workspace = true
thiserror.workspace = true

# PDF pages through PDFium (BSD-3), loaded at run time from the app bundle
# (Contents/Frameworks/libpdfium.dylib); scripts/fetch-pdfium.sh gets it.
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "image_025", "thread_safe"] }

[dev-dependencies]
# The comparison example renders imported pages the way Zebra draws them.
zebra-render = { path = "../zebra-render", default-features = false }
serde_json.workspace = true
