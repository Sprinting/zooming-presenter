[package]
name = "zebra-app"
description = "Zebra: native infinite-canvas presentation app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zebra"
path = "src/main.rs"

[lib]
name = "zebra_app"
path = "src/lib.rs"

[dependencies]
zebra-core.workspace = true
zebra-render.workspace = true
kurbo.workspace = true
zebra-api.workspace = true
# File > Export > Web Page: the exporter and its embedded web player.
zebra-web = { path = "../zebra-web" }
# File > Import (PDF pages as frames).
zebra-import = { path = "../zebra-import" }
zebra-media.workspace = true
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
rfd.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true
image.workspace = true
png.workspace = true
base64.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
# Window-level AppKit calls only (title, edited dot, proxy icon, accent
# colour, Reduce Motion, App Nap, screens). Never controls inside the egui UI.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSGeometry", "NSRange", "NSNotification", "NSURL", "NSUserDefaults", "NSFileManager", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSApplication", "NSResponder", "NSRunningApplication", "NSSpellChecker", "NSWorkspace", "NSEvent", "NSWindow", "NSView", "NSButton", "NSButtonCell", "NSControl", "NSColor", "NSGraphics", "NSActionCell", "NSCell", "block2"] }
raw-window-handle = "0.6"
# The YouTube and Vimeo play window (card_window.rs) only: the site's own
# embed player, nowhere else.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigationDelegate", "WKNavigationAction", "WKNavigation", "WKUIDelegate", "WKWindowFeatures", "WKFrameInfo", "WKPreferences", "WKUserContentController", "objc2-app-kit", "objc2-core-foundation", "block2"] }
block2 = "0.6"
# Only to keep a background launch from activating the app (--background).
winit = "0.30"

[dev-dependencies]
zebra-pdf.workspace = true
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
ruzstd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }
