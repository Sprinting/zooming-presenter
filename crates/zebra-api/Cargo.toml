[package]
name = "zebra-api"
description = "JSON-RPC automation API (Unix socket) for driving Zebra"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Honour ZEBRA_DATA_DIR / ZEBRA_GROUP_DIR in release builds (perf.sh only;
# never in the shipped app). Debug builds always honour them.
dev-overrides = []

[dependencies]
zebra-core.workspace = true
# CPU-only rendering: headless must not need a GPU.
zebra-render = { path = "../zebra-render", default-features = false }
# File > Export > Web Page (the player is built and embedded by its build.rs).
zebra-web = { path = "../zebra-web" }
# The `import` method (PDF pages as frames).
zebra-import = { path = "../zebra-import" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
rand.workspace = true
libc.workspace = true
