[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
zebra-core = { path = "crates/zebra-core" }
zebra-render = { path = "crates/zebra-render" }
zebra-api = { path = "crates/zebra-api" }
zebra-media = { path = "crates/zebra-media" }

serde = { version = "1", features = ["derive"] }
# float_roundtrip: a saved number reads back bit for bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1.2"
thiserror = "2"
anyhow = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
# Clip-art pack: per-symbol zstd frames with a per-set dictionary. Pure
# Rust decoder (no C build); the app never compresses.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

# rendering
kurbo = "0.13"
peniko = "*"
vello = "0.12"
vello_cpu = { version = "0.4", features = ["multithreading"] }
parley = "0.13"
krilla = "0.8"
# SVG symbols (clip art): parsed and drawn to pixels; no text, no system fonts.
resvg = { version = "0.50", default-features = false }
pollster = "1"

# ui
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "clipboard", "default_fonts", "persistence"] }
egui = "0.37"
egui-wgpu = "0.37"
muda = "0.21"
rfd = "0.18"
# i18n: Project Fluent via i18n-embed (compile-time checked keys with fl!)
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
egui_kittest = "0.37"

# api
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "fs"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
rand = "0.9"
libc = "0.2"

[profile.dev.package."*"]
opt-level = 2

# Smaller app (measured 19 Nov, Linux x86-64, zebra / zebractl):
# default 62.7 / 4.7 MB; stripped 49.7 / 3.2; thin LTO 46.4 / 2.2;
# fat LTO 38.6 / 2.0 (and faster to build than thin here).
# DSYM=1 scripts/bundle-macos.sh keeps symbols for crash reports.
# panic stays "unwind": the canvas and thumbnails catch renderer panics.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
